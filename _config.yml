# Open Graph / SEO
logo: /assets/images/logo.png
image: /assets/images/og-default.png
social:
  name: 최건우
  links:
    - https://github.com/uniaut
    - https://www.linkedin.com/in/건우-최-7362ba2b2

# Twitter Card (카카오톡도 참고)
twitter:
  card: summary_large_image

# Build settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  posts:
    output: true
    permalink: /articles/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - .DS_Store
