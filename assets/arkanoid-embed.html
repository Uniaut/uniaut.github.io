<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Arkanoid Auto-Play Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
    }

    /* Strict 400px Widget Container */
    #widget-container {
      position: relative;
      width: 400px;
      max-width: 100vw;
      height: 520px;
      background-color: #000000;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
      border-radius: 6px;
    }

    canvas {
      display: block;
      width: 400px;
      height: 520px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Floating control buttons overlay */
    .widget-overlay {
      position: absolute;
      bottom: 8px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 20;
    }

    .btn {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      font-size: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      padding: 4px 8px;
      border-radius: 9999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      outline: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }

    /* CRT scanline overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 10;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div id="widget-container">
    <div class="scanlines"></div>
    <canvas id="gameCanvas" width="400" height="520"></canvas>
    
    <div class="widget-overlay">
      <button class="btn active" id="btn-mode" title="Toggle Auto-Play">🤖 AUTO</button>
      <button class="btn" id="btn-sound" title="Toggle Sound">🔊</button>
      <button class="btn" id="btn-reset" title="Restart Round">🎲</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const btnMode = document.getElementById('btn-mode');
    const btnSound = document.getElementById('btn-sound');
    const btnReset = document.getElementById('btn-reset');

    // Web Audio Synthesizer (Zero dependencies)
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      initAudio();
      const now = audioCtx.currentTime;

      if (type === 'brick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(480 + Math.random() * 80, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'ceiling') {
        // High pitch cheerful ping when destroying bricks from the ceiling
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800 + Math.random() * 200, now);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.04);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } else if (type === 'paddle') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'wall') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(190, now);
        osc.frequency.exponentialRampToValueAtTime(130, now + 0.04);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } else if (type === 'clear') {
        const freqs = [523.25, 659.25, 783.99, 1046.5];
        freqs.forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, now + idx * 0.08);
          gain.gain.setValueAtTime(0.15, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.22);
        });
      }
    }

    // Canvas & Playfield Sizing (Width = 400, Height = 520)
    const W = 400;
    const H = 520;
    const HEADER_H = 34;
    const BORDER_W = 14; // Pipe frame width on left and right
    const BORDER_TOP = HEADER_H + 12;

    const PLAY_LEFT = BORDER_W;
    const PLAY_RIGHT = W - BORDER_W;
    const PLAY_TOP = BORDER_TOP;
    const PLAY_BOTTOM = H;
    const PLAY_WIDTH = PLAY_RIGHT - PLAY_LEFT; // 372px

    // Isometric Cube Background Texture Generator (Cached on offscreen canvas)
    const bgPatternCanvas = document.createElement('canvas');
    bgPatternCanvas.width = 32;
    bgPatternCanvas.height = 32;
    const bgCtx = bgPatternCanvas.getContext('2d');
    (function createIsometricTexture() {
      // 3 Shades of deep Arkanoid Blue
      const cTop = '#0000a8';
      const cLeft = '#000060';
      const cRight = '#000088';

      bgCtx.fillStyle = '#000050';
      bgCtx.fillRect(0, 0, 32, 32);

      // Diamond Isometric pattern
      function drawIsometricCube(cx, cy, s) {
        // Top Face (Diamond)
        bgCtx.fillStyle = cTop;
        bgCtx.beginPath();
        bgCtx.moveTo(cx, cy - s);
        bgCtx.lineTo(cx + s, cy);
        bgCtx.lineTo(cx, cy + s);
        bgCtx.lineTo(cx - s, cy);
        bgCtx.closePath();
        bgCtx.fill();

        // Left Face
        bgCtx.fillStyle = cLeft;
        bgCtx.beginPath();
        bgCtx.moveTo(cx - s, cy);
        bgCtx.lineTo(cx, cy + s);
        bgCtx.lineTo(cx, cy + s * 2);
        bgCtx.lineTo(cx - s, cy + s);
        bgCtx.closePath();
        bgCtx.fill();

        // Right Face
        bgCtx.fillStyle = cRight;
        bgCtx.beginPath();
        bgCtx.moveTo(cx, cy + s);
        bgCtx.lineTo(cx + s, cy);
        bgCtx.lineTo(cx + s, cy + s);
        bgCtx.lineTo(cx, cy + s * 2);
        bgCtx.closePath();
        bgCtx.fill();
      }

      drawIsometricCube(16, 8, 8);
      drawIsometricCube(0, 24, 8);
      drawIsometricCube(32, 24, 8);
    })();
    const bgPattern = ctx.createPattern(bgPatternCanvas, 'repeat');

    // Brick Color Palette with 3D Bevel Styling
    const BRICK_PALETTE = {
      'G': { main: '#00e000', light: '#70ff70', dark: '#008000', score: 80, name: 'Green' },
      'W': { main: '#e0e0e0', light: '#ffffff', dark: '#888888', score: 50, name: 'White' },
      'R': { main: '#e80000', light: '#ff6666', dark: '#880000', score: 90, name: 'Red' },
      'Y': { main: '#d8b800', light: '#ffea60', dark: '#786000', score: 120, name: 'Gold' },
      'M': { main: '#d800d8', light: '#ff70ff', dark: '#780078', score: 110, name: 'Magenta' },
      'B': { main: '#0058e8', light: '#60a0ff', dark: '#002888', score: 100, name: 'Blue' },
      'C': { main: '#00d8d8', light: '#70ffff', dark: '#007878', score: 70, name: 'Cyan' }
    };

    // Brick Grid Specifications (11 Columns, 8 Rows)
    const COLS = 11;
    const ROWS = 8;
    const BRICK_GAP_X = 1;
    const BRICK_GAP_Y = 2;
    const BRICK_W = Math.floor((PLAY_WIDTH - (COLS - 1) * BRICK_GAP_X) / COLS); // 32px
    const BRICK_H = 13;
    const BRICK_START_Y = PLAY_TOP + 46; // Leaving a 46px ceiling space above bricks!
    const BRICK_OFFSET_X = PLAY_LEFT + Math.floor((PLAY_WIDTH - (COLS * BRICK_W + (COLS - 1) * BRICK_GAP_X)) / 2);

    // Initial Stage Layout matching the user's Arkanoid screenshot exactly!
    const STAGE_LAYOUTS = [
      [
        "GGGGGGGGGGG", // Row 0
        "WWWYYYYYYYY", // Row 1
        "RRRRRRRRRRR", // Row 2
        "YYYYYYYYWWW", // Row 3
        "MMMMMMMMMMM", // Row 4
        "BBYYYYYYYYY", // Row 5
        "CCCCCCCCCCC", // Row 6
        "YYYYYY CCCC"  // Row 7 (with right-side break)
      ],
      [
        "RRRRRRRRRRR",
        "YYYYYYYYYYY",
        "BBBBBBBBBBB",
        "MMMMMMMMMMM",
        "GGGGGGGGGGG",
        "CCCCCCCCCCC",
        "WWWWWWWWWWW",
        "YYYYYYYYYYY"
      ]
    ];

    let currentStageIndex = 0;
    let bricks = [];
    let particles = [];
    let score = 0;
    let highScore = 42500;
    let roundNumber = 1;
    let lives = 3;

    // Vaus Paddle
    const paddle = {
      w: 58,
      h: 12,
      x: W / 2 - 29,
      y: H - 38,
      vx: 0,
      targetX: W / 2 - 29,
      maxSpeed: 8.5
    };

    // Energy Ball
    const ball = {
      x: W / 2,
      y: H - 56,
      r: 4.5,
      vx: 2.8,
      vy: -4.2,
      speed: 5.0,
      baseSpeed: 5.0,
      isCeilingMode: false,
      stuckToPaddle: false
    };

    let autoPlay = true;
    let roundClearTimer = 0;

    // Initialize Stage Bricks
    function initBricks(stageIndex) {
      bricks = [];
      const layout = STAGE_LAYOUTS[stageIndex % STAGE_LAYOUTS.length];
      for (let r = 0; r < ROWS; r++) {
        const rowStr = layout[r] || "GGGGGGGGGGG";
        for (let c = 0; c < COLS; c++) {
          const type = rowStr[c];
          if (type && type !== ' ' && BRICK_PALETTE[type]) {
            const bx = BRICK_OFFSET_X + c * (BRICK_W + BRICK_GAP_X);
            const by = BRICK_START_Y + r * (BRICK_H + BRICK_GAP_Y);
            bricks.push({
              r,
              c,
              x: bx,
              y: by,
              w: BRICK_W,
              h: BRICK_H,
              type,
              alive: true
            });
          }
        }
      }
    }

    // Reset Ball on Paddle
    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      ball.speed = ball.baseSpeed;
      // Angle towards the right side to start digging tunnel
      const angle = -Math.PI / 2 + (Math.random() > 0.5 ? 0.35 : -0.35);
      ball.vx = Math.sin(angle) * ball.speed;
      ball.vy = -Math.abs(Math.cos(angle) * ball.speed);
      ball.isCeilingMode = false;
      ball.stuckToPaddle = false;
    }

    function resetGame() {
      score = 0;
      roundNumber = 1;
      lives = 3;
      initBricks(0);
      paddle.x = W / 2 - paddle.w / 2;
      paddle.targetX = paddle.x;
      resetBall();
    }
    resetGame();

    // Spawn Brick Destruction Particles
    function spawnBrickParticles(x, y, w, h, color) {
      for (let i = 0; i < 10; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 3.5;
        particles.push({
          x: x + w / 2 + (Math.random() - 0.5) * w * 0.6,
          y: y + h / 2 + (Math.random() - 0.5) * h * 0.6,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd - 0.8,
          size: 2 + Math.random() * 2,
          color,
          alpha: 1.0,
          life: 25 + Math.random() * 15
        });
      }
    }

    // AI Autopilot Decision Logic
    // Classical Arkanoid Repertoire:
    // 1. Dig tunnel on far right (or left) column
    // 2. Guide ball into the tunnel towards the ceiling
    // 3. Let ball bounce continuously between ceiling & top of bricks to wipe them out!
    function updateAI() {
      if (!autoPlay) return;

      // Check tunnel status: count alive bricks in col 10 (rightmost) vs col 0 (leftmost)
      let rightColAlive = 0;
      let leftColAlive = 0;
      for (const b of bricks) {
        if (!b.alive) continue;
        if (b.c === COLS - 1) rightColAlive++;
        if (b.c === 0) leftColAlive++;
      }

      // Pick the easiest tunnel side
      const targetTunnelCol = (rightColAlive <= leftColAlive) ? (COLS - 1) : 0;
      const tunnelIsReady = (targetTunnelCol === COLS - 1 ? rightColAlive === 0 : leftColAlive === 0);

      // Check if ball is currently above bricks in ceiling area
      const ceilingY = BRICK_START_Y;
      ball.isCeilingMode = (ball.y < ceilingY + 5);

      if (ball.vy > 0) {
        // Ball is falling down towards paddle: Predict intercept position
        const dy = paddle.y - ball.y;
        const t = dy / ball.vy;
        let predX = ball.x + ball.vx * t;

        // Account for side wall bounces
        while (predX < PLAY_LEFT + ball.r || predX > PLAY_RIGHT - ball.r) {
          if (predX < PLAY_LEFT + ball.r) {
            predX = 2 * (PLAY_LEFT + ball.r) - predX;
          } else if (predX > PLAY_RIGHT - ball.r) {
            predX = 2 * (PLAY_RIGHT - ball.r) - predX;
          }
        }

        // Apply intentional paddle offset to steer the ball!
        let desiredHitOffset = 0; // -1 (left tip) to +1 (right tip)

        if (!tunnelIsReady) {
          // Tunnel is not yet open: Steer ball towards the target tunnel column
          if (targetTunnelCol === COLS - 1) {
            // Send ball towards right: hit with the right side of the paddle
            desiredHitOffset = 0.45;
          } else {
            // Send ball towards left: hit with the left side of the paddle
            desiredHitOffset = -0.45;
          }
        } else {
          // Tunnel IS open! High probability of shooting ball straight into the tunnel!
          if (targetTunnelCol === COLS - 1) {
            // Aim into right tunnel
            desiredHitOffset = 0.65;
          } else {
            // Aim into left tunnel
            desiredHitOffset = -0.65;
          }
        }

        // If ball came from ceiling and already cleared a lot, just aim safely towards center
        if (bricks.filter(b => b.alive).length < 8) {
          desiredHitOffset = (Math.random() - 0.5) * 0.3;
        }

        // Target paddle center
        paddle.targetX = predX - (desiredHitOffset * (paddle.w * 0.42)) - (paddle.w / 2);
      } else {
        // Ball is going up: Smoothly reposition towards safe center or tunnel entrance
        if (ball.isCeilingMode) {
          // Ball is happily destroying bricks from ceiling!
          // Position paddle near the center or bottom exit to catch it smoothly
          paddle.targetX = (PLAY_LEFT + PLAY_RIGHT) / 2 - paddle.w / 2;
        } else {
          // Follow ball horizontally with slight easing
          paddle.targetX = ball.x - paddle.w / 2;
        }
      }

      // Clamp target within walls
      const minX = PLAY_LEFT + 2;
      const maxX = PLAY_RIGHT - paddle.w - 2;
      paddle.targetX = Math.max(minX, Math.min(maxX, paddle.targetX));

      // Smooth realistic paddle motion (no teleportation)
      const diff = paddle.targetX - paddle.x;
      const step = Math.sign(diff) * Math.min(Math.abs(diff) * 0.22, paddle.maxSpeed);
      paddle.x += step;
    }

    // Manual Mouse/Touch Controls
    canvas.addEventListener('mousemove', (e) => {
      if (autoPlay) return;
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      paddle.x = Math.max(PLAY_LEFT + 2, Math.min(PLAY_RIGHT - paddle.w - 2, clientX - paddle.w / 2));
    });

    canvas.addEventListener('touchmove', (e) => {
      if (autoPlay) return;
      const rect = canvas.getBoundingClientRect();
      const touchX = e.touches[0].clientX - rect.left;
      paddle.x = Math.max(PLAY_LEFT + 2, Math.min(PLAY_RIGHT - paddle.w - 2, touchX - paddle.w / 2));
    }, { passive: true });

    // Physics Update Loop
    function updatePhysics() {
      updateAI();

      // Ball Movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Left Wall
      if (ball.x - ball.r <= PLAY_LEFT) {
        ball.x = PLAY_LEFT + ball.r;
        ball.vx = Math.abs(ball.vx);
        playSound('wall');
      }
      // Right Wall
      else if (ball.x + ball.r >= PLAY_RIGHT) {
        ball.x = PLAY_RIGHT - ball.r;
        ball.vx = -Math.abs(ball.vx);
        playSound('wall');
      }

      // Ceiling
      if (ball.y - ball.r <= PLAY_TOP) {
        ball.y = PLAY_TOP + ball.r;
        ball.vy = Math.abs(ball.vy);
        playSound(ball.isCeilingMode ? 'ceiling' : 'wall');
      }

      // Paddle Collision
      if (
        ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x + ball.r >= paddle.x &&
        ball.x - ball.r <= paddle.x + paddle.w
      ) {
        ball.y = paddle.y - ball.r;

        // Classical Arkanoid angular deflection based on hit position
        const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const clampedOffset = Math.max(-0.95, Math.min(0.95, hitOffset));

        // Max reflection angle ~66 degrees
        const maxAngle = Math.PI * 0.38;
        const angle = clampedOffset * maxAngle;

        // Reset speed to normal on paddle hit
        ball.speed = ball.baseSpeed;
        ball.vx = ball.speed * Math.sin(angle);
        ball.vy = -ball.speed * Math.cos(angle);
        ball.isCeilingMode = false;

        playSound('paddle');
      }

      // Bottom pit (Life loss)
      if (ball.y - ball.r > H) {
        lives--;
        if (lives <= 0) {
          lives = 3;
          score = Math.max(0, score - 500);
        }
        resetBall();
      }

      // Brick Collision (High Performance AABB)
      let hitBrick = null;
      for (const b of bricks) {
        if (!b.alive) continue;

        if (
          ball.x + ball.r >= b.x &&
          ball.x - ball.r <= b.x + b.w &&
          ball.y + ball.r >= b.y &&
          ball.y - ball.r <= b.y + b.h
        ) {
          hitBrick = b;
          break;
        }
      }

      if (hitBrick) {
        hitBrick.alive = false;
        const brickDef = BRICK_PALETTE[hitBrick.type] || BRICK_PALETTE['G'];
        score += brickDef.score;
        if (score > highScore) highScore = score;

        spawnBrickParticles(hitBrick.x, hitBrick.y, hitBrick.w, hitBrick.h, brickDef.main);

        // Determine collision normal from overlap depth
        const overlapLeft = (ball.x + ball.r) - hitBrick.x;
        const overlapRight = (hitBrick.x + hitBrick.w) - (ball.x - ball.r);
        const overlapTop = (ball.y + ball.r) - hitBrick.y;
        const overlapBottom = (hitBrick.y + hitBrick.h) - (ball.y - ball.r);

        const minOverlapX = Math.min(overlapLeft, overlapRight);
        const minOverlapY = Math.min(overlapTop, overlapBottom);

        if (minOverlapX < minOverlapY) {
          ball.vx = -ball.vx;
        } else {
          ball.vy = -ball.vy;
        }

        // When hit from ceiling, speed up slightly for that classic fast-paced thrill!
        if (ball.y < BRICK_START_Y + 10) {
          playSound('ceiling');
          ball.speed = Math.min(6.5, ball.baseSpeed * 1.15);
        } else {
          playSound('brick');
        }

        // Check if all alive bricks are cleared
        const remaining = bricks.filter(b => b.alive).length;
        if (remaining === 0) {
          playSound('clear');
          roundClearTimer = 60; // 1 second celebration pause
        }
      }

      // Round clear transition
      if (roundClearTimer > 0) {
        roundClearTimer--;
        if (roundClearTimer === 0) {
          roundNumber++;
          currentStageIndex++;
          initBricks(currentStageIndex);
          resetBall();
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12; // gravity
        p.life--;
        p.alpha = Math.max(0, p.life / 30);
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Render Scene Functions
    function drawHeader() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, HEADER_H);

      ctx.font = 'bold 12px "Courier New", monospace';
      
      // 1UP & Score
      ctx.fillStyle = '#ff0000';
      ctx.fillText('1UP', 36, 14);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(score).padStart(6, '0'), 36, 28);

      // HIGH SCORE
      ctx.fillStyle = '#ff0000';
      ctx.fillText('HIGH SCORE', 155, 14);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(String(highScore).padStart(6, '0'), 175, 28);

      // ROUND
      ctx.fillStyle = '#ff0000';
      ctx.fillText('ROUND', 320, 14);
      ctx.fillStyle = '#00ffff';
      ctx.fillText(String(roundNumber).padStart(2, '0'), 334, 28);
    }

    function drawMetallicPipes() {
      // 1. Left Vertical Pipe
      const leftGrad = ctx.createLinearGradient(0, 0, BORDER_W, 0);
      leftGrad.addColorStop(0, '#444444');
      leftGrad.addColorStop(0.25, '#ffffff');
      leftGrad.addColorStop(0.65, '#aaaaaa');
      leftGrad.addColorStop(1, '#222222');
      ctx.fillStyle = leftGrad;
      ctx.fillRect(0, BORDER_TOP, BORDER_W, H - BORDER_TOP);

      // 2. Right Vertical Pipe
      const rightGrad = ctx.createLinearGradient(W - BORDER_W, 0, W, 0);
      rightGrad.addColorStop(0, '#222222');
      rightGrad.addColorStop(0.35, '#aaaaaa');
      rightGrad.addColorStop(0.75, '#ffffff');
      rightGrad.addColorStop(1, '#444444');
      ctx.fillStyle = rightGrad;
      ctx.fillRect(W - BORDER_W, BORDER_TOP, BORDER_W, H - BORDER_TOP);

      // 3. Top Horizontal Pipe
      const topGrad = ctx.createLinearGradient(0, BORDER_TOP - 12, 0, BORDER_TOP);
      topGrad.addColorStop(0, '#444444');
      topGrad.addColorStop(0.3, '#ffffff');
      topGrad.addColorStop(0.7, '#aaaaaa');
      topGrad.addColorStop(1, '#222222');
      ctx.fillStyle = topGrad;
      ctx.fillRect(BORDER_W, BORDER_TOP - 12, PLAY_WIDTH, 12);

      // Joints / Pipe Rings with Black Grooves (Arkanoid Signature Detail)
      ctx.fillStyle = '#000000';
      const jointInterval = 68;
      for (let y = BORDER_TOP + 30; y < H; y += jointInterval) {
        // Left pipe ring slots
        ctx.fillRect(2, y, BORDER_W - 4, 2);
        ctx.fillRect(2, y + 4, BORDER_W - 4, 2);
        ctx.fillRect(2, y + 8, BORDER_W - 4, 2);

        // Right pipe ring slots
        ctx.fillRect(W - BORDER_W + 2, y, BORDER_W - 4, 2);
        ctx.fillRect(W - BORDER_W + 2, y + 4, BORDER_W - 4, 2);
        ctx.fillRect(W - BORDER_W + 2, y + 8, BORDER_W - 4, 2);
      }

      // Center Nameplate: "DESIGN BY TAITO"
      const plateW = 120;
      const plateH = 10;
      const plateX = (W - plateW) / 2;
      const plateY = BORDER_TOP - 11;

      ctx.fillStyle = '#888888';
      ctx.fillRect(plateX, plateY, plateW, plateH);
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 7px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('DESIGN BY TAITO', W / 2, plateY + 8);
      ctx.textAlign = 'start';
    }

    function drawBricks() {
      for (const b of bricks) {
        if (!b.alive) continue;
        const color = BRICK_PALETTE[b.type] || BRICK_PALETTE['G'];

        // 3D Brick Drop Shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fillRect(b.x + 2, b.y + b.h, b.w, 2);

        // Brick Body
        ctx.fillStyle = color.main;
        ctx.fillRect(b.x, b.y, b.w, b.h);

        // Top & Left Highlight Bevel
        ctx.fillStyle = color.light;
        ctx.beginPath();
        ctx.moveTo(b.x, b.y + b.h);
        ctx.lineTo(b.x, b.y);
        ctx.lineTo(b.x + b.w, b.y);
        ctx.lineTo(b.x + b.w - 2, b.y + 2);
        ctx.lineTo(b.x + 2, b.y + 2);
        ctx.lineTo(b.x + 2, b.y + b.h - 2);
        ctx.closePath();
        ctx.fill();

        // Bottom & Right Shadow Bevel
        ctx.fillStyle = color.dark;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w, b.y);
        ctx.lineTo(b.x + b.w, b.y + b.h);
        ctx.lineTo(b.x, b.y + b.h);
        ctx.lineTo(b.x + 2, b.y + b.h - 2);
        ctx.lineTo(b.x + b.w - 2, b.y + b.h - 2);
        ctx.lineTo(b.x + b.w - 2, b.y + 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawVaus(x, y, w, h) {
      // Drop Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      ctx.roundRect(x + 5, y + h - 1, w, 5, 3);
      ctx.fill();

      const capW = 11;
      const midW = w - capW * 2;

      // 1. Center Metallic Cylinder Body
      const bodyGrad = ctx.createLinearGradient(0, y, 0, y + h);
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(0.2, '#dddddd');
      bodyGrad.addColorStop(0.5, '#999999');
      bodyGrad.addColorStop(0.85, '#555555');
      bodyGrad.addColorStop(1, '#222222');

      ctx.fillStyle = bodyGrad;
      ctx.fillRect(x + capW, y, midW, h);

      // Center Highlight Streak
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + capW, y + 2, midW, 2);

      // Thin separation lines
      ctx.fillStyle = '#000000';
      ctx.fillRect(x + capW - 1, y, 1, h);
      ctx.fillRect(x + capW + midW, y, 1, h);

      // 2. Left Red/Orange Cap
      const leftCapGrad = ctx.createLinearGradient(0, y, 0, y + h);
      leftCapGrad.addColorStop(0, '#ff7700');
      leftCapGrad.addColorStop(0.4, '#e62200');
      leftCapGrad.addColorStop(1, '#880000');

      ctx.fillStyle = leftCapGrad;
      ctx.beginPath();
      ctx.roundRect(x + 2, y, capW - 2, h, [5, 0, 0, 5]);
      ctx.fill();

      // Left Blue Tip
      ctx.fillStyle = '#00d8ff';
      ctx.beginPath();
      ctx.roundRect(x, y + 3, 3, h - 6, 2);
      ctx.fill();

      // 3. Right Red/Orange Cap
      ctx.fillStyle = leftCapGrad;
      ctx.beginPath();
      ctx.roundRect(x + capW + midW, y, capW - 2, h, [0, 5, 5, 0]);
      ctx.fill();

      // Right Blue Tip
      ctx.fillStyle = '#00d8ff';
      ctx.beginPath();
      ctx.roundRect(x + w - 3, y + 3, 3, h - 6, 2);
      ctx.fill();
    }

    function drawBall() {
      // Ball Drop Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.beginPath();
      ctx.arc(ball.x + 3, ball.y + 3, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Ball Outer Ring (Crisp White)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Ball Inner Cyan Core
      ctx.fillStyle = '#00ffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r * 0.58, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      ctx.globalAlpha = 1.0;
    }

    function drawLivesHUD() {
      // Display Mini-Vaus icons for remaining lives at bottom-left
      for (let i = 0; i < lives - 1; i++) {
        drawVaus(PLAY_LEFT + 4 + i * 26, H - 18, 22, 6);
      }
    }

    // Main Render Loop (Strict 60 FPS)
    function render() {
      // 1. Draw Playfield Background Pattern
      ctx.fillStyle = bgPattern;
      ctx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_WIDTH, PLAY_BOTTOM - PLAY_TOP);

      // 2. Bricks
      drawBricks();

      // 3. Particles
      drawParticles();

      // 4. Vaus Paddle & Energy Ball
      drawVaus(paddle.x, paddle.y, paddle.w, paddle.h);
      drawBall();

      // 5. Metallic Borders & Header UI
      drawMetallicPipes();
      drawHeader();
      drawLivesHUD();

      // Ceiling Infiltration Aura FX
      if (ball.isCeilingMode) {
        ctx.fillStyle = 'rgba(0, 255, 255, 0.08)';
        ctx.fillRect(PLAY_LEFT, PLAY_TOP, PLAY_WIDTH, 46);
      }
    }

    function loop() {
      updatePhysics();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // Controls Event Listeners
    btnMode.addEventListener('click', () => {
      autoPlay = !autoPlay;
      btnMode.textContent = autoPlay ? '🤖 AUTO' : '🎮 MANUAL';
      btnMode.classList.toggle('active', autoPlay);
    });

    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      btnSound.textContent = soundEnabled ? '🔊' : '🔇';
      btnSound.classList.toggle('active', soundEnabled);
    });

    btnReset.addEventListener('click', () => {
      resetGame();
    });
  </script>
</body>
