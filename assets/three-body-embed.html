<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Three-Body Simulation (Star-Planet-Moon)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // --- PERFORMANCE TUNING ---
    const TARGET_FPS = 30; // Strict 30 FPS Cap for blog lightness
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    const MAX_TRAIL_POINTS = 520;
    const PHYSICS_SUBSTEPS = 8;

    // Simulation Parameters: Star-Planet-Moon (Hierarchical 3-Body System)
    const G = 1.0;
    const softening = 0.015;
    const simSpeed = 0.9; // Smooth and graceful orbital velocity

    // Visual Palette
    // Body 0: Star (Amber Sun)
    // Body 1: Planet (Sapphire Earth)
    // Body 2: Moon (Rose Satellite)
    const BODY_COLORS = [
      { main: 0xd97706, hex: '#d97706', trailR: 0.98, trailG: 0.75, trailB: 0.14, radius: 0.18 }, // Star
      { main: 0x0284c7, hex: '#0284c7', trailR: 0.22, trailG: 0.74, trailB: 0.97, radius: 0.09 }, // Planet
      { main: 0xe11d48, hex: '#e11d48', trailR: 0.96, trailG: 0.25, trailB: 0.37, radius: 0.05 }  // Moon
    ];

    // --- ZERO-ALLOCATION FLAT PHYSICS BUFFERS (3 Bodies x 3 Dim = 9 Elements) ---
    const pos = new Float64Array(9);
    const vel = new Float64Array(9);
    const mass = new Float64Array(3);

    // Initial Configuration: Star - Planet - Moon (Inclined 3D Hierarchy)
    // Star (Center)
    mass[0] = 16.0;
    pos[0] = 0.0;   pos[1] = 0.0;    pos[2] = 0.0;
    vel[0] = 0.0;   vel[1] = -0.055; vel[2] = 0.0;

    // Planet (Orbiting Star with slight 3D inclination)
    mass[1] = 0.85;
    pos[3] = 2.4;   pos[4] = 0.0;    pos[5] = 0.0;
    vel[3] = 0.0;   vel[4] = 2.52;   vel[5] = 0.22;

    // Moon (Orbiting Planet in tilted 3D loop)
    mass[2] = 0.04;
    pos[6] = 2.76;  pos[7] = 0.0;    pos[8] = 0.0;
    vel[6] = 0.0;   vel[7] = 3.92;   vel[8] = -0.28;

    // Pre-allocated temporary buffers for RK4
    const k1_v = new Float64Array(9), k1_a = new Float64Array(9);
    const k2_v = new Float64Array(9), k2_a = new Float64Array(9);
    const k3_v = new Float64Array(9), k3_a = new Float64Array(9);
    const k4_v = new Float64Array(9), k4_a = new Float64Array(9);
    const tmp_p = new Float64Array(9), tmp_v = new Float64Array(9);

    let isVisible = true;

    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    // Fixed graceful isometric viewpoint
    camera.position.set(0, -4.6, 4.4);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "low-power"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.3));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = false; // Fixed viewpoint (no disorienting spinning)
    controls.target.set(0, 0, 0);

    // Studio Ambient & Directional Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.55);
    dirLight1.position.set(8, 12, 10);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xe2e8f0, 0.3);
    dirLight2.position.set(-8, -8, -6);
    scene.add(dirLight2);

    // --- 3D SKYBOX GRID (Subtle Grid Cage for Depth Perception) ---
    function createSkyboxGrid(size = 8.5, divisions = 6) {
      const group = new THREE.Group();
      const half = size / 2;
      const step = size / divisions;

      const points = [];
      for (let i = -half; i <= half; i += step) {
        // Floor (Z = -half)
        points.push(new THREE.Vector3(-half, i, -half), new THREE.Vector3(half, i, -half));
        points.push(new THREE.Vector3(i, -half, -half), new THREE.Vector3(i, half, -half));

        // Back Wall (Y = half)
        points.push(new THREE.Vector3(-half, half, i), new THREE.Vector3(half, half, i));
        points.push(new THREE.Vector3(i, half, -half), new THREE.Vector3(i, half, half));

        // Left Wall (X = -half)
        points.push(new THREE.Vector3(-half, -half, i), new THREE.Vector3(-half, half, i));
        points.push(new THREE.Vector3(-half, i, -half), new THREE.Vector3(-half, i, half));
      }

      const gridGeo = new THREE.BufferGeometry().setFromPoints(points);
      const gridMat = new THREE.LineBasicMaterial({
        color: 0x94a3b8,
        transparent: true,
        opacity: 0.22,
        linewidth: 1
      });
      const gridLines = new THREE.LineSegments(gridGeo, gridMat);
      group.add(gridLines);

      // Bounding Box Outer Frame
      const boxGeo = new THREE.BoxGeometry(size, size, size);
      const boxEdges = new THREE.EdgesGeometry(boxGeo);
      const boxEdgeMat = new THREE.LineBasicMaterial({
        color: 0x64748b,
        transparent: true,
        opacity: 0.32,
        linewidth: 1.5
      });
      const boxFrame = new THREE.LineSegments(boxEdges, boxEdgeMat);
      group.add(boxFrame);

      // Central Axis Reference Lines
      const axisPoints = [
        new THREE.Vector3(-half, 0, 0), new THREE.Vector3(half, 0, 0),
        new THREE.Vector3(0, -half, 0), new THREE.Vector3(0, half, 0),
        new THREE.Vector3(0, 0, -half), new THREE.Vector3(0, 0, half)
      ];
      const axisGeo = new THREE.BufferGeometry().setFromPoints(axisPoints);
      const axisMat = new THREE.LineBasicMaterial({
        color: 0x0284c7,
        transparent: true,
        opacity: 0.16
      });
      const axisLines = new THREE.LineSegments(axisGeo, axisMat);
      group.add(axisLines);

      return group;
    }

    const skyboxGrid = createSkyboxGrid(8.5, 6);
    scene.add(skyboxGrid);

    // --- CELESTIAL BODIES & FAST TRAILS ---
    const bodyMeshes = [];
    const trailGeos = [];
    const trailPosArrays = [];
    const trailColArrays = [];
    const trailCounts = [0, 0, 0];

    for (let i = 0; i < 3; i++) {
      const radius = BODY_COLORS[i].radius;
      const sphereGeo = new THREE.SphereGeometry(radius, 24, 24);
      const material = new THREE.MeshStandardMaterial({
        color: BODY_COLORS[i].main,
        roughness: 0.2,
        metalness: 0.2,
        emissive: BODY_COLORS[i].main,
        emissiveIntensity: i === 0 ? 0.45 : 0.25
      });
      const mesh = new THREE.Mesh(sphereGeo, material);
      scene.add(mesh);
      bodyMeshes.push(mesh);

      // Soft Glow Sprite for the Sun (Body 0)
      if (i === 0) {
        const canvasGlow = document.createElement('canvas');
        canvasGlow.width = 64;
        canvasGlow.height = 64;
        const ctxGlow = canvasGlow.getContext('2d');
        const grad = ctxGlow.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, '#f59e0b');
        grad.addColorStop(0.35, '#f59e0b44');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctxGlow.fillStyle = grad;
        ctxGlow.fillRect(0, 0, 64, 64);
        const texture = new THREE.CanvasTexture(canvasGlow);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(0.8, 0.8, 0.8);
        mesh.add(sprite);
      }

      // Pre-allocated static TypedArrays for trail
      const posArray = new Float32Array(MAX_TRAIL_POINTS * 3);
      const colArray = new Float32Array(MAX_TRAIL_POINTS * 3);

      const trailGeo = new THREE.BufferGeometry();
      trailGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      trailGeo.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
      trailGeo.setDrawRange(0, 0);

      const trailMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.82,
        linewidth: i === 2 ? 1.2 : 1.8
      });
      const trailLine = new THREE.Line(trailGeo, trailMat);
      scene.add(trailLine);

      trailGeos.push(trailGeo);
      trailPosArrays.push(posArray);
      trailColArrays.push(colArray);
    }

    // --- ZERO-ALLOCATION FAST RK4 PHYSICS ---
    function computeAcc(p, m, G_const, eps2, out_a) {
      out_a[0] = 0; out_a[1] = 0; out_a[2] = 0;
      out_a[3] = 0; out_a[4] = 0; out_a[5] = 0;
      out_a[6] = 0; out_a[7] = 0; out_a[8] = 0;

      const pairs = [0, 3,  0, 6,  3, 6];
      const mPairs = [0, 1,  0, 2,  1, 2];

      for (let k = 0; k < 6; k += 2) {
        const i3 = pairs[k];
        const j3 = pairs[k + 1];
        const mi = mPairs[k];
        const mj = mPairs[k + 1];

        const dx = p[j3] - p[i3];
        const dy = p[j3 + 1] - p[i3 + 1];
        const dz = p[j3 + 2] - p[i3 + 2];

        const distSq = dx * dx + dy * dy + dz * dz + eps2;
        const invDist3 = G_const / (distSq * Math.sqrt(distSq));

        const fx = dx * invDist3;
        const fy = dy * invDist3;
        const fz = dz * invDist3;

        out_a[i3]     += m[mj] * fx;
        out_a[i3 + 1] += m[mj] * fy;
        out_a[i3 + 2] += m[mj] * fz;

        out_a[j3]     -= m[mi] * fx;
        out_a[j3 + 1] -= m[mi] * fy;
        out_a[j3 + 2] -= m[mi] * fz;
      }
    }

    function fastRK4Step(dt, G_const, eps) {
      const eps2 = eps * eps;

      // Step 1
      for (let i = 0; i < 9; i++) k1_v[i] = vel[i];
      computeAcc(pos, mass, G_const, eps2, k1_a);

      // Step 2
      for (let i = 0; i < 9; i++) {
        tmp_p[i] = pos[i] + 0.5 * dt * k1_v[i];
        tmp_v[i] = vel[i] + 0.5 * dt * k1_a[i];
      }
      for (let i = 0; i < 9; i++) k2_v[i] = tmp_v[i];
      computeAcc(tmp_p, mass, G_const, eps2, k2_a);

      // Step 3
      for (let i = 0; i < 9; i++) {
        tmp_p[i] = pos[i] + 0.5 * dt * k2_v[i];
        tmp_v[i] = vel[i] + 0.5 * dt * k2_a[i];
      }
      for (let i = 0; i < 9; i++) k3_v[i] = tmp_v[i];
      computeAcc(tmp_p, mass, G_const, eps2, k3_a);

      // Step 4
      for (let i = 0; i < 9; i++) {
        tmp_p[i] = pos[i] + dt * k3_v[i];
        tmp_v[i] = vel[i] + dt * k3_a[i];
      }
      for (let i = 0; i < 9; i++) k4_v[i] = tmp_v[i];
      computeAcc(tmp_p, mass, G_const, eps2, k4_a);

      // Final update
      const dt6 = dt / 6.0;
      for (let i = 0; i < 9; i++) {
        pos[i] += dt6 * (k1_v[i] + 2.0 * (k2_v[i] + k3_v[i]) + k4_v[i]);
        vel[i] += dt6 * (k1_a[i] + 2.0 * (k2_a[i] + k3_a[i]) + k4_a[i]);
      }
    }

    // --- FAST DIRECT TRAIL RECORDING ---
    function recordTrailPoint(bodyIdx, x, y, z) {
      const pArr = trailPosArrays[bodyIdx];
      const cArr = trailColArrays[bodyIdx];
      let count = trailCounts[bodyIdx];

      if (count < MAX_TRAIL_POINTS) {
        pArr[count * 3]     = x;
        pArr[count * 3 + 1] = y;
        pArr[count * 3 + 2] = z;
        count++;
        trailCounts[bodyIdx] = count;
      } else {
        pArr.copyWithin(0, 3, MAX_TRAIL_POINTS * 3);
        const last = (MAX_TRAIL_POINTS - 1) * 3;
        pArr[last]     = x;
        pArr[last + 1] = y;
        pArr[last + 2] = z;
      }

      const r = BODY_COLORS[bodyIdx].trailR;
      const g = BODY_COLORS[bodyIdx].trailG;
      const b = BODY_COLORS[bodyIdx].trailB;
      const invCount = 1.0 / count;

      for (let k = 0; k < count; k++) {
        const alpha = k * invCount;
        const k3 = k * 3;
        cArr[k3]     = r * alpha;
        cArr[k3 + 1] = g * alpha;
        cArr[k3 + 2] = b * alpha;
      }

      const geo = trailGeos[bodyIdx];
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
      geo.setDrawRange(0, count);
    }

    // --- INTERSECTION OBSERVER (Zero CPU usage when offscreen) ---
    const observer = new IntersectionObserver((entries) => {
      isVisible = entries[0].isIntersecting;
    }, { threshold: 0.05 });
    observer.observe(container);

    document.addEventListener('visibilitychange', () => {
      isVisible = !document.hidden;
    });

    // --- MAIN 30 FPS LOOP ---
    let lastFrameTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      if (!isVisible) return; // Completely idle when offscreen

      // Strict 30 FPS Frame Throttle
      const elapsed = now - lastFrameTime;
      if (elapsed < FRAME_INTERVAL - 1) {
        return;
      }
      lastFrameTime = now - (elapsed % FRAME_INTERVAL);

      // Physics Integration (8 substeps at 30 FPS)
      const dt = (1 / 30) * simSpeed / PHYSICS_SUBSTEPS;
      for (let s = 0; s < PHYSICS_SUBSTEPS; s++) {
        fastRK4Step(dt, G, softening);
      }

      // Record trails & Update 3D Spheres
      for (let i = 0; i < 3; i++) {
        const i3 = i * 3;
        const x = pos[i3], y = pos[i3 + 1], z = pos[i3 + 2];
        bodyMeshes[i].position.set(x, y, z);
        recordTrailPoint(i, x, y, z);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    requestAnimationFrame(animate);
  </script>
</body>
</html>
