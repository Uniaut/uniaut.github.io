<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Möbius Strip / 뫼비우스의 띠</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #aaaaaa 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container { width: 100%; height: 100%; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3.8;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Soft Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight1.position.set(6, 8, 8);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xdbeafe, 0.6);
    dirLight2.position.set(-6, -6, -5);
    scene.add(dirLight2);

    const pointLight = new THREE.PointLight(0xbae6fd, 0.5, 10);
    pointLight.position.set(0, 4, 3);
    scene.add(pointLight);

    // Smooth Parametric Möbius Strip with Light Blue to White Gradient
    const U = 160; // Smooth longitudinal resolution
    const V = 32;  // Smooth cross-sectional resolution
    const R = 1.15;
    const w = 0.65;

    function createMobiusGeometry(uSegs, vSegs, radius, width) {
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const indices = [];

      // Color Palette: Vibrant Blue to Modern Cool Grey
      const colorBlue = new THREE.Color(0x0080ff); // Saturated azure blue
      const colorGrey = new THREE.Color(0xd1d5db); // Modern cool grey

      for (let i = 0; i <= uSegs; i++) {
        const u = (i / uSegs) * Math.PI * 2;
        for (let j = 0; j <= vSegs; j++) {
          const v = -width / 2 + (j / vSegs) * width;
          const x = (radius + v * Math.cos(u / 2)) * Math.cos(u);
          const y = (radius + v * Math.cos(u / 2)) * Math.sin(u);
          const z = v * Math.sin(u / 2);
          positions.push(x, y, z);

          // Smooth continuous gradient factor across twist and 3D spatial height
          const tLoop = 0.5 + 0.5 * Math.sin(u) * Math.cos(u / 2);
          const tHeight = 0.2 * (z / (width / 2 || 1));
          const t = Math.max(0, Math.min(1, tLoop + tHeight));

          // Interpolate vertex color (Blue to Grey)
          const vertexColor = new THREE.Color().lerpColors(colorBlue, colorGrey, t);
          colors.push(vertexColor.r, vertexColor.g, vertexColor.b);
        }
      }

      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) {
          const v0 = i * (vSegs + 1) + j;
          const v1 = (i + 1) * (vSegs + 1) + j;
          const v2 = (i + 1) * (vSegs + 1) + (j + 1);
          const v3 = i * (vSegs + 1) + (j + 1);

          indices.push(v0, v1, v2);
          indices.push(v0, v2, v3);
        }
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    const geometry = createMobiusGeometry(U, V, R, w);

    // Silky smooth physical material with 50% opacity & clean blending
    const material = new THREE.MeshPhysicalMaterial({
      vertexColors: true,
      roughness: 0.15,
      metalness: 0.08,
      clearcoat: 0.9,
      clearcoatRoughness: 0.1,
      transparent: true,
      opacity: 0.5,
      depthWrite: false,
      side: THREE.DoubleSide,
      flatShading: false
    });

    const mesh = new THREE.Mesh(geometry, material);
    scene.add(mesh);

    // Initial orientation
    mesh.rotation.x = 25 * Math.PI / 180;
    mesh.rotation.y = 0;
    mesh.rotation.z = 35 * Math.PI / 180;

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Smooth multi-axis rotation to showcase 3D ribbon topology and gradient
      mesh.rotation.x += (25 * Math.PI / 180) * delta;
      mesh.rotation.y += (45 * Math.PI / 180) * delta;
      mesh.rotation.z += (15 * Math.PI / 180) * delta;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
