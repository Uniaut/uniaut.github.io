<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Polyhedron</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #aaaaaa 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shapeType = (urlParams.get('shape') || 'cube').toLowerCase();

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3.8;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Soft lights for flat specular highlights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xe2e8f0, 0.4);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // Create Geometry based on shape parameter
    let geometry;
    switch(shapeType) {
      case 'tetrahedron': // 정사면체 (4면체)
        geometry = new THREE.TetrahedronGeometry(1.2);
        break;
      case 'octahedron': // 정팔면체 (8면체)
        geometry = new THREE.OctahedronGeometry(1.1);
        break;
      case 'dodecahedron': // 정십이사면체 (12면체)
        geometry = new THREE.DodecahedronGeometry(1.0);
        break;
      case 'icosahedron': // 정이십면체 (20면체)
        geometry = new THREE.IcosahedronGeometry(1.0);
        break;
      case 'buckyball':
      case 'truncated_icosahedron': // 깎은 정이십면체
        geometry = new THREE.IcosahedronGeometry(1.0, 1);
        break;
      case 'torus': // 토러스
        geometry = new THREE.TorusGeometry(0.85, 0.4, 16, 32);
        break;
      case 'mobius':
      case 'mobius_strip': {
        const U = 160, V = 32, R = 1.15, w = 0.65;
        const positions = [];
        const colors = [];
        const indices = [];
        const colorBlue = new THREE.Color(0x0080ff);
        const colorGrey = new THREE.Color(0xd1d5db);

        for (let i = 0; i <= U; i++) {
          const u = (i / U) * Math.PI * 2;
          for (let j = 0; j <= V; j++) {
            const v = -w / 2 + (j / V) * w;
            const x = (R + v * Math.cos(u / 2)) * Math.cos(u);
            const y = (R + v * Math.cos(u / 2)) * Math.sin(u);
            const z = v * Math.sin(u / 2);
            positions.push(x, y, z);

            const tLoop = 0.5 + 0.5 * Math.sin(u) * Math.cos(u / 2);
            const tHeight = 0.2 * (z / (w / 2 || 1));
            const t = Math.max(0, Math.min(1, tLoop + tHeight));
            const vertexColor = new THREE.Color().lerpColors(colorBlue, colorGrey, t);
            colors.push(vertexColor.r, vertexColor.g, vertexColor.b);
          }
        }
        for (let i = 0; i < U; i++) {
          for (let j = 0; j < V; j++) {
            const v0 = i * (V + 1) + j;
            const v1 = (i + 1) * (V + 1) + j;
            const v2 = (i + 1) * (V + 1) + (j + 1);
            const v3 = i * (V + 1) + (j + 1);
            indices.push(v0, v1, v2);
            indices.push(v0, v2, v3);
          }
        }
        geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        break;
      }
      case 'cube':
      case 'hexahedron':
      default: // 정육면체 (6면체)
        geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        break;
    }

    const isMobius = shapeType === 'mobius' || shapeType === 'mobius_strip';

    // Material setup: Smooth physical gradient for mobius, flatShaded glass for polyhedra
    const material = isMobius
      ? new THREE.MeshPhysicalMaterial({
          vertexColors: true,
          roughness: 0.15,
          metalness: 0.08,
          clearcoat: 0.9,
          clearcoatRoughness: 0.1,
          transparent: true,
          opacity: 0.5,
          depthWrite: false,
          side: THREE.DoubleSide,
          flatShading: false
        })
      : new THREE.MeshStandardMaterial({
          color: 0xe2e8f0,
          roughness: 0.2,
          metalness: 0.1,
          transparent: true,
          opacity: 0.25,
          flatShading: true,
          side: THREE.DoubleSide
        });

    const mesh = new THREE.Mesh(geometry, material);

    if (!isMobius) {
      // Soft gray edge wireframe outline matching CSS 1px border
      const edges = new THREE.EdgesGeometry(geometry);
      const lineMaterial = new THREE.LineBasicMaterial({ 
        color: 0x6b7280, 
        transparent: true, 
        opacity: 0.35, 
        linewidth: 1 
      });
      const wireframe = new THREE.LineSegments(edges, lineMaterial);
      mesh.add(wireframe);
    }

    scene.add(mesh);

    // Initial orientation
    mesh.rotation.x = shapeType.includes('mobius') ? 25 * Math.PI / 180 : 0;
    mesh.rotation.y = 0;
    mesh.rotation.z = shapeType.includes('mobius') ? 35 * Math.PI / 180 : 45 * Math.PI / 180;

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Rotation speeds: X: 30 deg/s, Y: 60 deg/s, Z: 0 deg/s
      mesh.rotation.x += (30 * Math.PI / 180) * delta;
      mesh.rotation.y += (60 * Math.PI / 180) * delta;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
