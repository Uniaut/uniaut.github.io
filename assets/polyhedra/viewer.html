<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Polyhedron</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #ffffff 0%, #aaaaaa 100%);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const shapeType = (urlParams.get('shape') || 'cube').toLowerCase();

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 3.8;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Soft lights for flat specular highlights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0xe2e8f0, 0.4);
    dirLight2.position.set(-5, -5, -5);
    scene.add(dirLight2);

    // Create Geometry based on shape parameter
    let geometry;
    switch(shapeType) {
      case 'tetrahedron': // 정사면체 (4면체)
        geometry = new THREE.TetrahedronGeometry(1.2);
        break;
      case 'octahedron': // 정팔면체 (8면체)
        geometry = new THREE.OctahedronGeometry(1.1);
        break;
      case 'dodecahedron': // 정십이사면체 (12면체)
        geometry = new THREE.DodecahedronGeometry(1.0);
        break;
      case 'icosahedron': // 정이십면체 (20면체)
        geometry = new THREE.IcosahedronGeometry(1.0);
        break;
      case 'buckyball':
      case 'truncated_icosahedron': // 깎은 정이십면체
        geometry = new THREE.IcosahedronGeometry(1.0, 1);
        break;
      case 'torus': // 토러스
        geometry = new THREE.TorusGeometry(0.85, 0.4, 16, 32);
        break;
      case 'cube':
      case 'hexahedron':
      default: // 정육면체 (6면체)
        geometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
        break;
    }

    // Flat-shaded light-gray translucent glass material matching exact blog cube face style
    const material = new THREE.MeshStandardMaterial({
      color: 0xe2e8f0,
      roughness: 0.2,
      metalness: 0.1,
      transparent: true,
      opacity: 0.22,
      flatShading: true,
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(geometry, material);

    // Soft gray edge wireframe outline matching CSS 1px border
    const edges = new THREE.EdgesGeometry(geometry);
    const lineMaterial = new THREE.LineBasicMaterial({ 
      color: 0x6b7280, 
      transparent: true, 
      opacity: 0.35, 
      linewidth: 1 
    });
    const wireframe = new THREE.LineSegments(edges, lineMaterial);
    mesh.add(wireframe);

    scene.add(mesh);

    // Initial orientation: (0deg, 0deg, 45deg)
    mesh.rotation.x = 0;
    mesh.rotation.y = 0;
    mesh.rotation.z = 45 * Math.PI / 180;

    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Rotation speeds: X: 30 deg/s, Y: 60 deg/s, Z: 0 deg/s
      mesh.rotation.x += (30 * Math.PI / 180) * delta;
      mesh.rotation.y += (60 * Math.PI / 180) * delta;

      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
