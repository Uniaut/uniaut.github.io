<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dual Pendulum Chaos Simulation / 이중 진자</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Segoe UI", Roboto, sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    body.light {
      background-color: #f8fafc;
      color: #0f172a;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    /* Floating Glassmorphic Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 10;
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    body.light .toolbar {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 32px;
      padding: 0 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 500;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    body.light .btn {
      color: #1e293b;
      background: rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }
    body.light .btn:hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .btn-icon {
      width: 32px;
      padding: 0;
    }
    /* Info badge */
    .telemetry {
      position: absolute;
      bottom: 16px;
      left: 16px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 10;
    }
    body.light .telemetry {
      color: rgba(0, 0, 0, 0.5);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    /* Interaction Hint */
    .hint {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.5s ease;
    }
    body.light .hint {
      color: rgba(0, 0, 0, 0.4);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="toolbar">
    <button class="btn btn-icon" id="btn-play" title="Play / Pause">⏸</button>
    <button class="btn" id="btn-random" title="Randomize Angles">🎲 Random</button>
    <button class="btn" id="btn-ensemble" title="Toggle Chaos Ensemble">🦋 Chaos (5x)</button>
    <button class="btn btn-icon" id="btn-clear" title="Clear Trace">🧹</button>
    <button class="btn btn-icon" id="btn-theme" title="Toggle Theme">🌓</button>
  </div>

  <div class="telemetry" id="telemetry">FPS: 60 | Mode: Single</div>
  <div class="hint" id="hint">💡 Drag pendulum bobs to interact</div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const telemetry = document.getElementById('telemetry');
    const hint = document.getElementById('hint');

    // UI Buttons
    const btnPlay = document.getElementById('btn-play');
    const btnRandom = document.getElementById('btn-random');
    const btnEnsemble = document.getElementById('btn-ensemble');
    const btnClear = document.getElementById('btn-clear');
    const btnTheme = document.getElementById('btn-theme');

    let isLight = false;
    let isPaused = false;
    let ensembleMode = false; // false = 1, true = 5 pendulums
    const ENSEMBLE_COUNT = 5;

    // Canvas sizing & scaling
    let width = 0;
    let height = 0;
    let originX = 0;
    let originY = 0;
    let dpr = 1;
    let L1 = 120;
    let L2 = 120;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);

      originX = width / 2;
      originY = height * 0.38;

      // Scale rod lengths according to viewport
      const scale = Math.min(width, height) / 380;
      L1 = Math.max(70, Math.min(150, 110 * scale));
      L2 = Math.max(70, Math.min(150, 110 * scale));
    }
    window.addEventListener('resize', resize);
    resize();

    // Physics parameters (Standard SI dimensionless scaling)
    const g = 9.81 * 80;
    const m1 = 10;
    const m2 = 10;
    const MAX_TRAIL = 600;

    // Palette for ensemble
    const PALETTE = [
      { stroke: '#38bdf8', glow: 'rgba(56, 189, 248, 0.35)', head: '#0284c7' }, // Cyan
      { stroke: '#f43f5e', glow: 'rgba(244, 63, 94, 0.35)', head: '#e11d48' },  // Rose
      { stroke: '#10b981', glow: 'rgba(16, 185, 129, 0.35)', head: '#059669' }, // Emerald
      { stroke: '#fbbf24', glow: 'rgba(251, 191, 36, 0.35)', head: '#d97706' }, // Amber
      { stroke: '#c084fc', glow: 'rgba(192, 132, 252, 0.35)', head: '#9333ea' }  // Purple
    ];

    class Pendulum {
      constructor(th1, th2, colorIndex = 0) {
        this.th1 = th1;
        this.th2 = th2;
        this.w1 = 0;
        this.w2 = 0;
        this.color = PALETTE[colorIndex % PALETTE.length];
        this.trail = [];
      }

      reset(th1, th2) {
        this.th1 = th1;
        this.th2 = th2;
        this.w1 = 0;
        this.w2 = 0;
        this.trail = [];
      }

      getPositions() {
        const x1 = originX + L1 * Math.sin(this.th1);
        const y1 = originY + L1 * Math.cos(this.th1);
        const x2 = x1 + L2 * Math.sin(this.th2);
        const y2 = y1 + L2 * Math.cos(this.th2);
        return { x1, y1, x2, y2 };
      }
    }

    let pendulums = [];
    function initPendulums(baseTh1 = Math.PI / 2, baseTh2 = Math.PI / 2) {
      pendulums = [];
      const count = ensembleMode ? ENSEMBLE_COUNT : 1;
      const delta = 0.0002; // Butterfly effect perturbation
      for (let i = 0; i < count; i++) {
        const p = new Pendulum(baseTh1 + i * delta, baseTh2 + i * delta, i);
        pendulums.push(p);
      }
    }
    initPendulums(Math.PI * 0.55, Math.PI * 0.65);

    // Lagrangian Mechanics & RK4 Integrator
    function derivatives(th1, th2, w1, w2) {
      const dth = th1 - th2;
      const num1 = -g * (2 * m1 + m2) * Math.sin(th1) - m2 * g * Math.sin(th1 - 2 * th2) - 2 * Math.sin(dth) * m2 * (w2 * w2 * L2 + w1 * w1 * L1 * Math.cos(dth));
      const den1 = L1 * (2 * m1 + m2 - m2 * Math.cos(2 * dth));
      const a1 = num1 / den1;

      const num2 = 2 * Math.sin(dth) * (w1 * w1 * L1 * (m1 + m2) + g * (m1 + m2) * Math.cos(th1) + w2 * w2 * L2 * m2 * Math.cos(dth));
      const den2 = L2 * (2 * m1 + m2 - m2 * Math.cos(2 * dth));
      const a2 = num2 / den2;

      return [w1, w2, a1, a2];
    }

    function rk4Step(p, dt) {
      const { th1, th2, w1, w2 } = p;
      const [dw1_1, dw2_1, a1_1, a2_1] = derivatives(th1, th2, w1, w2);
      const [dw1_2, dw2_2, a1_2, a2_2] = derivatives(th1 + 0.5 * dt * dw1_1, th2 + 0.5 * dt * dw2_1, w1 + 0.5 * dt * a1_1, w2 + 0.5 * dt * a2_1);
      const [dw1_3, dw2_3, a1_3, a2_3] = derivatives(th1 + 0.5 * dt * dw1_2, th2 + 0.5 * dt * dw2_2, w1 + 0.5 * dt * a1_2, w2 + 0.5 * dt * a2_2);
      const [dw1_4, dw2_4, a1_4, a2_4] = derivatives(th1 + dt * dw1_3, th2 + dt * dw2_3, w1 + dt * a1_3, w2 + dt * a2_3);

      p.th1 += (dt / 6) * (dw1_1 + 2 * dw1_2 + 2 * dw1_3 + dw1_4);
      p.th2 += (dt / 6) * (dw2_1 + 2 * dw2_2 + 2 * dw2_3 + dw2_4);
      p.w1 += (dt / 6) * (a1_1 + 2 * a1_2 + 2 * a1_3 + a1_4);
      p.w2 += (dt / 6) * (a2_1 + 2 * a2_2 + 2 * a2_3 + a2_4);

      // Infinitesimal natural damping to stabilize numerical floating point
      p.w1 *= 0.99999;
      p.w2 *= 0.99999;
    }

    // Dragging interaction
    let draggingBob = null; // 1 or 2
    let dragPendulum = null;

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onPointerDown(e) {
      const { x, y } = getPointerPos(e);
      const main = pendulums[0];
      const pos = main.getPositions();

      const dist1 = Math.hypot(x - pos.x1, y - pos.y1);
      const dist2 = Math.hypot(x - pos.x2, y - pos.y2);

      if (dist2 < 30) {
        draggingBob = 2;
        dragPendulum = main;
        hint.style.opacity = '0';
      } else if (dist1 < 25) {
        draggingBob = 1;
        dragPendulum = main;
        hint.style.opacity = '0';
      }
    }

    function onPointerMove(e) {
      if (!draggingBob || !dragPendulum) return;
      const { x, y } = getPointerPos(e);

      if (draggingBob === 1) {
        dragPendulum.th1 = Math.atan2(x - originX, y - originY);
        dragPendulum.w1 = 0;
      } else if (draggingBob === 2) {
        const x1 = originX + L1 * Math.sin(dragPendulum.th1);
        const y1 = originY + L1 * Math.cos(dragPendulum.th1);
        dragPendulum.th2 = Math.atan2(x - x1, y - y1);
        dragPendulum.w2 = 0;
      }

      // Sync other pendulums with tiny offset if in ensemble
      if (ensembleMode) {
        const delta = 0.0002;
        for (let i = 1; i < pendulums.length; i++) {
          pendulums[i].th1 = dragPendulum.th1 + i * delta;
          pendulums[i].th2 = dragPendulum.th2 + i * delta;
          pendulums[i].w1 = 0;
          pendulums[i].w2 = 0;
          pendulums[i].trail = [];
        }
      }
      dragPendulum.trail = [];
    }

    function onPointerUp() {
      draggingBob = null;
      dragPendulum = null;
    }

    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    // UI Event Handlers
    btnPlay.addEventListener('click', () => {
      isPaused = !isPaused;
      btnPlay.textContent = isPaused ? '▶' : '⏸';
    });

    btnRandom.addEventListener('click', () => {
      const th1 = (Math.random() - 0.5) * Math.PI * 1.8;
      const th2 = (Math.random() - 0.5) * Math.PI * 1.8;
      initPendulums(th1, th2);
    });

    btnEnsemble.addEventListener('click', () => {
      ensembleMode = !ensembleMode;
      btnEnsemble.classList.toggle('active', ensembleMode);
      btnEnsemble.textContent = ensembleMode ? '🦋 Chaos (5x)' : 'Single (1x)';
      const main = pendulums[0];
      initPendulums(main.th1, main.th2);
      telemetry.textContent = `FPS: -- | Mode: ${ensembleMode ? 'Chaos Ensemble (5x)' : 'Single'}`;
    });

    btnClear.addEventListener('click', () => {
      pendulums.forEach(p => p.trail = []);
    });

    btnTheme.addEventListener('click', () => {
      isLight = !isLight;
      document.body.classList.toggle('light', isLight);
    });

    // Strict 30 FPS Cap
    const TARGET_FPS = 30;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    let lastFrameTime = 0;

    // FPS Meter
    let frameCount = 0;
    let fps = 30;

    // Main Simulation & Render Loop
    function animate(now) {
      requestAnimationFrame(animate);

      // Strict 30 FPS Cap
      const elapsed = now - lastFrameTime;
      if (elapsed < FRAME_INTERVAL - 1) {
        return;
      }
      lastFrameTime = now - (elapsed % FRAME_INTERVAL);

      // Calculate FPS
      frameCount++;
      if (frameCount % 15 === 0) {
        fps = Math.round(1000 / Math.max(1, elapsed));
        telemetry.textContent = `FPS: ${Math.min(30, fps)} | Mode: ${ensembleMode ? 'Chaos Ensemble (5x)' : 'Single'}`;
      }

      // Physics substeps for exact RK4 stability (8 substeps at 30 FPS)
      if (!isPaused && !draggingBob) {
        const substeps = 8;
        const dt = (1 / 30) / substeps;
        for (let s = 0; s < substeps; s++) {
          for (let i = 0; i < pendulums.length; i++) {
            rk4Step(pendulums[i], dt);
          }
        }
      }

      // Record trails
      for (let i = 0; i < pendulums.length; i++) {
        const p = pendulums[i];
        const pos = p.getPositions();
        p.trail.push({ x: pos.x2, y: pos.y2 });
        if (p.trail.length > 240) {
          p.trail.shift();
        }
      }

      // Render Scene
      ctx.clearRect(0, 0, width, height);

      // Draw subtle pivot base
      ctx.beginPath();
      ctx.arc(originX, originY, 5, 0, Math.PI * 2);
      ctx.fillStyle = isLight ? '#94a3b8' : '#475569';
      ctx.fill();

      // 1. Draw glowing trails (Batched into 8 chunks for 98% reduced CPU/GPU draw calls)
      ctx.lineWidth = ensembleMode ? 1.5 : 2.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const numChunks = 8;
      for (let i = 0; i < pendulums.length; i++) {
        const p = pendulums[i];
        const trail = p.trail;
        if (trail.length < 2) continue;

        const chunkSize = Math.ceil(trail.length / numChunks);
        for (let c = 0; c < numChunks; c++) {
          const startIdx = c * chunkSize;
          const endIdx = Math.min(startIdx + chunkSize + 1, trail.length);
          if (startIdx >= trail.length - 1) break;

          const progress = (startIdx + (endIdx - startIdx) / 2) / trail.length;
          const alpha = progress * (isLight ? 0.6 : 0.85);
          if (alpha <= 0.02) continue;

          ctx.beginPath();
          ctx.moveTo(trail[startIdx].x, trail[startIdx].y);
          for (let t = startIdx + 1; t < endIdx; t++) {
            ctx.lineTo(trail[t].x, trail[t].y);
          }
          ctx.strokeStyle = p.color.stroke;
          ctx.globalAlpha = alpha;
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1.0;

      // 2. Draw rods & bobs
      for (let i = pendulums.length - 1; i >= 0; i--) {
        const p = pendulums[i];
        const pos = p.getPositions();
        const isMain = i === 0;

        // Rod style
        ctx.lineWidth = isMain ? 2.5 : 1.2;
        ctx.strokeStyle = isLight 
          ? (isMain ? 'rgba(30, 41, 59, 0.7)' : 'rgba(148, 163, 184, 0.4)') 
          : (isMain ? 'rgba(241, 245, 249, 0.85)' : 'rgba(148, 163, 184, 0.35)');

        // Rod 1
        ctx.beginPath();
        ctx.moveTo(originX, originY);
        ctx.lineTo(pos.x1, pos.y1);
        ctx.stroke();

        // Rod 2
        ctx.beginPath();
        ctx.moveTo(pos.x1, pos.y1);
        ctx.lineTo(pos.x2, pos.y2);
        ctx.stroke();

        // Bob 1 (Mid joint)
        ctx.beginPath();
        ctx.arc(pos.x1, pos.y1, isMain ? 7 : 4, 0, Math.PI * 2);
        ctx.fillStyle = isLight ? '#0284c7' : '#38bdf8';
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = isLight ? '#ffffff' : '#0f172a';
        ctx.stroke();

        // Bob 2 (End bob with glow)
        if (isMain) {
          ctx.beginPath();
          ctx.arc(pos.x2, pos.y2, 10, 0, Math.PI * 2);
          ctx.fillStyle = isLight ? '#0369a1' : '#0284c7';
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#ffffff';
          ctx.stroke();
        } else {
          ctx.beginPath();
          ctx.arc(pos.x2, pos.y2, 5, 0, Math.PI * 2);
          ctx.fillStyle = p.color.head;
          ctx.fill();
        }
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
