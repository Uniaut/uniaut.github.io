---
layout: default
---

<article>
    <div class="flex flex-col space-y-6 mb-12">
        <time class="text-xs text-gray-400 font-mono tracking-widest uppercase">
            {{ page.date | date: "%Y. %m. %d" }}
        </time>
        <h1 class="text-4xl font-semibold leading-tight">
            {{ page.title }}
        </h1>
    </div>

    <div class="markdown-content">
        {{ content }}
    </div>

    <div class="mt-16 pt-8 border-t border-gray-100">
        <a href="/articles.html" class="text-sm font-medium hover:text-gray-400 transition-colors">
            ← 목록으로 돌아가기
        </a>
    </div>
</article>
